{{- $variant := .variant -}}
{{- $w := .width | default 72 -}}
{{- $h := .height | default 28 -}}
{{- if eq $variant "dipper" }}
<svg class="lattice dipper" width="{{ $w }}" height="{{ $h }}" viewBox="0 0 72 28" aria-hidden="true">
  <line x1="4" y1="3" x2="19" y2="4"/>
  <line x1="19" y1="4" x2="30" y2="7"/>
  <line x1="30" y1="7" x2="41" y2="10"/>
  <line x1="41" y1="10" x2="42" y2="22"/>
  <line x1="42" y1="22" x2="60" y2="22"/>
  <line x1="60" y1="22" x2="62" y2="9"/>
  <line x1="62" y1="9" x2="38" y2="10"/>
  <circle cx="4" cy="3" r="2.5"/><circle cx="19" cy="4" r="2.5"/><circle cx="30" cy="7" r="2.5"/>
  <circle cx="41" cy="10" r="2.5"/><circle cx="42" cy="22" r="2.5"/><circle cx="60" cy="22" r="2.5"/><circle cx="62" cy="9" r="2.5"/>
</svg>
{{- else if eq $variant "crux" }}
<svg class="lattice crux" width="{{ $w }}" height="{{ $h }}" viewBox="0 0 72 28" aria-hidden="true">
  <line x1="32" y1="3" x2="27" y2="25"/>
  <line x1="14" y1="13" x2="54" y2="17"/>
  <circle cx="32" cy="3" r="2.5"/><circle cx="27" cy="25" r="2.5"/>
  <circle cx="14" cy="13" r="2.5"/><circle cx="54" cy="17" r="2.5"/><circle cx="35" cy="20" r="1.5"/>
</svg>
{{- else if eq $variant "cassiopeia" }}
<svg class="lattice cassiopeia" width="{{ $w }}" height="{{ $h }}" viewBox="0 0 72 28" aria-hidden="true">
  <line x1="6" y1="4" x2="17" y2="15"/>
  <line x1="17" y1="15" x2="40" y2="13"/>
  <line x1="40" y1="13" x2="48" y2="26"/>
  <line x1="48" y1="26" x2="66" y2="17"/>
  <circle cx="6" cy="4" r="2.5"/><circle cx="17" cy="15" r="2.5"/><circle cx="40" cy="13" r="2.5"/>
  <circle cx="48" cy="26" r="2.5"/><circle cx="66" cy="17" r="2.5"/>
</svg>
{{- end -}}
