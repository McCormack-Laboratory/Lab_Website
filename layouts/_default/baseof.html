<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }} — Materials Science &amp; Engineering, UC Berkeley{{ else }}{{ .Title }} — {{ .Site.Params.brandLine }}{{ end }}</title>
<meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="{{ "img/crux_favicon.svg" | absURL }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
</head>
<body>

{{ partial "header.html" . }}

{{ if not .IsHome }}<canvas id="starfield" class="starfield-canvas" aria-hidden="true"></canvas>{{ end }}

{{ block "main" . }}{{ end }}

{{ partial "footer.html" . }}

<script src="{{ "js/main.js" | absURL }}"></script>
</body>
</html>
