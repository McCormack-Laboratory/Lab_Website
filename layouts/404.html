<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — {{ .Site.Params.brandLine }}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="{{ "img/crux_favicon.svg" | absURL }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
</head>
<body>

{{ partial "header.html" . }}

<section style="padding-top:5rem; padding-bottom:6rem; min-height:50vh; display:flex; align-items:center;">
  <div class="wrap" style="display:grid; grid-template-columns: 4rem 1fr; gap:1.5rem; align-items:start;">
    {{ partial "lattice.html" (dict "variant" "crux" "width" 56 "height" 22) }}
    <div>
      <p class="eyebrow">404</p>
      <h1 style="font-size: clamp(1.8rem, 4vw, 2.4rem);">This page isn't in our dataset</h1>
      <p class="lede">The page you're looking for doesn't exist, or may have moved. Try one of these instead:</p>
      <div class="btn-row">
        <a class="btn btn-primary" href="{{ "/" | relURL }}">Home</a>
        <a class="btn btn-ghost" href="{{ "/research/" | relURL }}">Research</a>
        <a class="btn btn-ghost" href="{{ "/people/" | relURL }}">People</a>
        <a class="btn btn-ghost" href="{{ "/contact/" | relURL }}">Contact</a>
      </div>
    </div>
  </div>
</section>

{{ partial "footer.html" . }}

</body>
</html>
